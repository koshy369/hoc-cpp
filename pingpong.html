<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Ping Pong Physics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: monospace;
        }
        canvas {
            background-color: #eecda3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

<div id="ui">BOT <span id="scoreBot">0</span> - <span id="scorePlayer">0</span> YOU</div>
<canvas id="gameCanvas" width="600" height="800"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- HỆ THỐNG VẬT LÝ & THÔNG SỐ BÀN ---
const TABLE = {
    x: 100, y: 150, width: 400, height: 500,
    color: '#27ae60', lineColor: '#fff'
};
const GRAVITY = 0.4;
const BOUNCE_DAMPING = 0.7; // Xung lực giảm dần

// --- ĐỐI TƯỢNG TRÒ CHƠI ---
let ball = {
    x: 300, y: 400, z: 50, // Z là độ cao
    vx: 0, vy: 5, vz: 5,
    baseRadius: 8,
    color: '#ffffff',
    flashTimer: 0,
    lastHitter: null, // 'player' hoặc 'bot'
    bounceA: 0, // Số lần nảy sân Bot (Top)
    bounceB: 0  // Số lần nảy sân Player (Bottom)
};

const player = { x: 300, y: 700, width: 80, height: 15, color: '#e74c3c' };
const bot = { x: 300, y: 100, width: 80, height: 15, color: '#3498db', speedCap: 4.5 };

// Điều khiển chuột/cảm ứng
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.clientX - rect.left;
});

function resetBall(scorer) {
    ball.x = 300; ball.y = 400; ball.z = 100;
    ball.vx = (Math.random() - 0.5) * 4;
    ball.vy = scorer === 'bot' ? 5 : -5; 
    ball.vz = 0;
    ball.lastHitter = null;
    ball.bounceA = 0; ball.bounceB = 0;
}

let scorePlayer = 0;
let scoreBot = 0;

function updateScore(winner) {
    if (winner === 'player') scorePlayer++;
    else scoreBot++;
    document.getElementById('scorePlayer').innerText = scorePlayer;
    document.getElementById('scoreBot').innerText = scoreBot;
    resetBall(winner);
}

// --- CỖ MÁY TRẠNG THÁI & LOGIC LUẬT CHƠI ---
function checkRules() {
    const isOutOfBounds = (ball.x < TABLE.x || ball.x > TABLE.x + TABLE.width || ball.y < TABLE.y || ball.y > TABLE.y + TABLE.height);
    
    // Bóng chạm đất (Rơi khỏi bàn)
    if (ball.z <= 0 && isOutOfBounds) {
        if (!ball.lastHitter) { resetBall('bot'); return; }
        
        if (ball.lastHitter === 'player') {
            if (ball.bounceA === 1 && ball.bounceB === 0) updateScore('player'); // Đập sân bot 1 lần rồi ra ngoài
            else updateScore('bot'); // Đánh thẳng ra ngoài hoặc đập sân nhà
        } else {
            if (ball.bounceB === 1 && ball.bounceA === 0) updateScore('bot');
            else updateScore('player');
        }
    }

    // Luật nảy 2 lần trên một sân
    if (ball.bounceA >= 2) updateScore('player');
    if (ball.bounceB >= 2) updateScore('bot');
}

function updatePhysics() {
    // Di chuyển tọa độ XY
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Quỹ đạo Parabol (Z-axis)
    ball.vz -= GRAVITY;
    ball.z += ball.vz;

    // Va chạm mặt bàn (Z = 0)
    if (ball.z <= 0 && ball.x >= TABLE.x && ball.x <= TABLE.x + TABLE.width && ball.y >= TABLE.y && ball.y <= TABLE.y + TABLE.height) {
        ball.z = 0;
        ball.vz = Math.abs(ball.vz) * BOUNCE_DAMPING; // Nảy lên
        ball.flashTimer = 5; // Kích hoạt Phản hồi thị giác
        
        // Cập nhật State Machine cho số lần nảy
        if (ball.y < TABLE.y + TABLE.height / 2) ball.bounceA++;
        else ball.bounceB++;
    } else if (ball.z < -20) {
        checkRules(); // Rơi xuống dưới ảo giác mặt bàn
    }

    // --- VA CHẠM VỚI VỢT ---
    function checkPaddleHit(paddle, hitterName, isPlayer) {
        // Mở rộng hitbox do bóng có thể nảy cao
        if (ball.x > paddle.x - paddle.width/2 - 15 && ball.x < paddle.x + paddle.width/2 + 15 &&
            ball.y > paddle.y - paddle.height/2 - 15 && ball.y < paddle.y + paddle.height/2 + 15 &&
            ball.z < 30 && ball.vz < 0) { // Chỉ đánh được khi bóng ở tầm thấp và đang rơi
            
            // Động học phản xạ (Deflection Vector)
            let hitPoint = ball.x - paddle.x;
            ball.vx = hitPoint * 0.15; // Đánh mép bẻ góc gắt
            ball.vy = isPlayer ? -Math.abs(ball.vy) - 0.5 : Math.abs(ball.vy) + 0.5; // Tăng dần tốc độ
            ball.vz = 8; // Force đánh hất bóng lên (Parabol)
            
            ball.lastHitter = hitterName;
            ball.bounceA = 0; ball.bounceB = 0; // Reset số lần nảy
        }
    }

    checkPaddleHit(player, 'player', true);
    checkPaddleHit(bot, 'bot', false);
}

function updateAI() {
    // Thuật toán Heuristic Tracking (Nội suy)
    // Chỉ tracking khi bóng bay về phía Bot
    if (ball.vy < 0) {
        let timeToReachBot = (bot.y - ball.y) / ball.vy;
        let predictedX = ball.x + (ball.vx * timeToReachBot);
        
        // Bot mưu mẹo di chuyển đến điểm rơi dự đoán thay vì bám theo X hiện tại
        let targetX = predictedX;
        
        // Giới hạn trong bàn
        if (targetX < TABLE.x) targetX = TABLE.x;
        if (targetX > TABLE.x + TABLE.width) targetX = TABLE.x + TABLE.width;

        // Nút thắt cổ chai cân bằng (Speed Cap)
        let diff = targetX - bot.x;
        if (Math.abs(diff) > bot.speedCap) {
            bot.x += Math.sign(diff) * bot.speedCap;
        } else {
            bot.x = targetX;
        }
    } else {
        // Trở về giữa sân khi bóng bay xa
        let diff = 300 - bot.x;
        bot.x += Math.sign(diff) * (bot.speedCap * 0.5);
    }
}

// --- RENDER ĐỒ HỌA ---
function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

function drawGame() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ Bàn (Table)
    drawRect(TABLE.x, TABLE.y, TABLE.width, TABLE.height, TABLE.color);
    ctx.strokeStyle = TABLE.lineColor;
    ctx.lineWidth = 4;
    ctx.strokeRect(TABLE.x, TABLE.y, TABLE.width, TABLE.height); // Viền
    ctx.beginPath();
    ctx.moveTo(TABLE.x, TABLE.y + TABLE.height/2);
    ctx.lineTo(TABLE.x + TABLE.width, TABLE.y + TABLE.height/2);
    ctx.stroke(); // Lưới (Net)
    ctx.beginPath();
    ctx.moveTo(TABLE.x + TABLE.width/2, TABLE.y);
    ctx.lineTo(TABLE.x + TABLE.width/2, TABLE.y + TABLE.height);
    ctx.stroke(); // Vạch chia giữa

    // Vẽ Vợt (Được phép ra ngoài phạm vi bàn)
    drawRect(player.x - player.width/2, player.y - player.height/2, player.width, player.height, player.color);
    drawRect(bot.x - bot.width/2, bot.y - bot.height/2, bot.width, bot.height, bot.color);

    // Vẽ Bóng đổ (Shadow) 2D tĩnh
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    // Shadow di chuyển X, Y nhưng giữ nguyên kích thước, mờ đi khi bóng bay cao
    ctx.arc(ball.x, ball.y, ball.baseRadius, 0, Math.PI * 2);
    ctx.fill();

    // Vẽ Bóng 3D (Z-axis Projection)
    let currentRadius = ball.baseRadius + (ball.z * 0.1); // Phình to khi nảy cao
    if (currentRadius < 2) currentRadius = 2; // Giới hạn cực tiểu

    // Visual Feedback khi đập bàn
    let currentColor = ball.color;
    if (ball.flashTimer > 0) {
        currentColor = '#f1c40f'; // Chớp vàng
        ball.flashTimer--;
    }

    ctx.fillStyle = currentColor;
    ctx.beginPath();
    // Đánh lừa thị giác: Dời tọa độ Y của bóng lên trên (trừ đi Z) để tạo cảm giác bay lên không trung
    ctx.arc(ball.x, ball.y - ball.z, currentRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#000';
    ctx.stroke();
}

function gameLoop() {
    updatePhysics();
    updateAI();
    drawGame();
    requestAnimationFrame(gameLoop);
}

// Khởi chạy
resetBall();
gameLoop();
</script>
</body>
</html>
